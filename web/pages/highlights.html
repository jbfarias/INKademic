<div id="message" class="message"></div>

<div class="tabs">
  <button class="tab-btn active" onclick="switchTab('notes', this)">Notes</button>
  <button class="tab-btn" onclick="switchTab('screenshots', this)">Screenshots</button>
</div>

<div id="tab-notes" class="tab-content active">
  <div id="highlights-layout">
    <div id="book-sidebar">
      <h2>Books</h2>
      <input type="search" id="book-search" placeholder="Filter books…" aria-label="Filter books" oninput="renderBookList()" />
      <div id="book-list">
        <div class="loader-container"><span class="loader"></span></div>
      </div>
    </div>

    <div id="highlights-main">
      <div id="highlights-empty-state">
        <p class="empty-hint">Select a book to view its highlights.</p>
      </div>
      <div id="highlights-toolbar" style="display:none;">
        <input
          type="search"
          id="highlight-search"
          class="highlight-search"
          placeholder="Search highlights and notes…"
          oninput="applyFilters()"
          aria-label="Search highlights and notes"
        />
        <select id="highlight-tag-filter" class="tag-filter" onchange="applyFilters()" aria-label="Filter by tag">
          <option value="">All tags / projects</option>
          <option value="*any">Any tag</option>
          <option value="*none">Untagged</option>
        </select>
        <label>Modified from <input type="date" id="highlight-date-from" onchange="applyFilters()" /></label>
        <label>to <input type="date" id="highlight-date-to" onchange="applyFilters()" /></label>
        <small>Dates require a synchronized reader clock. Older undated notes remain visible without a date filter.</small>
        <span id="filter-count" class="filter-count"></span>
        <select id="export-format" aria-label="Export format">
          <option value="md">Markdown</option>
          <option value="json">JSON</option>
          <option value="csv">CSV</option>
        </select>
        <button class="btn-export-notes" onclick="exportNotes()">Export Notes</button>
      </div>
      <div id="highlights-container" style="display:none;"></div>
    </div>
  </div>
</div>

<div id="tab-screenshots" class="tab-content" style="display:none;">
  <div id="screenshot-gallery">
    <div class="loader-container"><span class="loader"></span></div>
  </div>
</div>
